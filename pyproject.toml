[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TrackS"
version = "1.0.0"
description = "TrackS: Autonomous AI Goal & Penalty Tracker with Ruthless Accountability"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
tracks = "goal_tracker.agent_shell:launch_agent_shell"
TrackS = "goal_tracker.agent_shell:launch_agent_shell"
goaltrack = "goal_tracker.agent_shell:launch_agent_shell"
sentinel = "goal_tracker.agent_shell:launch_agent_shell"
